name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      SITE_SSM_ENV_PARAM: ${{ vars.SITE_SSM_ENV_PARAM }}
      LAMBDA_AUTH_SSM_ENV_PARAM: ${{ vars.LAMBDA_AUTH_SSM_ENV_PARAM }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/aws-auth
        with:
          role-arn: ${{ vars.IAM_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Audit
        run: yarn npm audit --all --severity moderate

      - name: Install Trivy
        # aquasecurity/setup-trivy (and trivy-action's own default setup step) installs via
        # contrib/install.sh, which downloads the binary from get.trivy.dev. That subdomain
        # has no DNS record at trivy.dev's authoritative nameserver (confirmed NXDOMAIN, not
        # a transient/corporate-network resolution issue) — so that install path is broken
        # until trivy.dev fixes their DNS. Installing directly from GitHub release assets
        # (already reachable here via actions/checkout) avoids that dependency entirely;
        # checksum is verified against the release's published list.
        env:
          TRIVY_VERSION: '0.76.1'
        run: |
          set -euo pipefail
          TARBALL="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSL -o "$TARBALL" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${TARBALL}"
          curl -sSL -o checksums.txt "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${TARBALL}\$" checksums.txt | sha256sum -c -
          tar -xzf "$TARBALL" trivy
          sudo install trivy /usr/local/bin/trivy
          rm -f "$TARBALL" checksums.txt trivy

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          skip-setup-trivy: true

      - name: Lint (affected)
        run: yarn nx affected --target=lint --base=origin/${{ github.base_ref }} --head=HEAD

      - name: Typecheck (affected)
        run: yarn nx affected --target=typecheck --base=origin/${{ github.base_ref }} --head=HEAD

      - name: Test (affected)
        run: yarn nx affected --target=test --base=origin/${{ github.base_ref }} --head=HEAD

      - name: Build (affected)
        run: yarn nx affected --target=build --configuration=ci --base=origin/${{ github.base_ref }} --head=HEAD
