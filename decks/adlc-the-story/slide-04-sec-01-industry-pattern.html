<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Section Divider</title>
<link rel="stylesheet" href="../../.claude/skills/deck-design-corporate/kit-corporate/shared/tokens.css">
<link rel="stylesheet" href="../../.claude/skills/deck-design-corporate/kit-corporate/shared/layouts.css">
<link rel="stylesheet" href="../../.claude/skills/deck-design-corporate/kit-corporate/shared/components.css">
</head>
<body>
  <div class="slide-stage">
    <div class="slide">
      <!-- bg from SECTION-DIVIDER pool (Dark 01/02/06), one per section, rotate
           01→02→06; section 1 → bg-title-01 -->
      <div class="layer bg bg-title-01"></div>
      <!-- PARAMETER: chapter number per section (assets/chapter/01..09.svg) -->
      <div class="layer divider-chapter"><img src="../../.claude/skills/deck-design-corporate/kit-corporate/assets/chapter/01.svg" alt="01"></div>
      <!-- PARAMETER: section heading. Keep ≤ ~55 chars (max 2 lines). -->
      <p class="layer divider-heading">The Industry Pattern</p>
      <!-- footer: brand tagline (fixed) + page number (auto). 2 slots only. -->
      <p class="layer footer-tagline txt-p7 c-text-contrast">Your Partner for Progress</p>
      <p class="layer page-number txt-p7 c-text-contrast">04</p>
    </div>
  </div>
</body>
</html>
