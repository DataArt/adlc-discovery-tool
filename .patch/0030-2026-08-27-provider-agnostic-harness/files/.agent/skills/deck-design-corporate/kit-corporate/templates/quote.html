<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Content — Quote</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/layouts.css">
<link rel="stylesheet" href="../shared/components.css">
</head>
<body>
  <!-- QUOTE — large pull-quote centred in the content zone + attribution.
       Editable: quote + attribution. -->
  <div class="slide-stage">
    <div class="slide">
      <div class="layer bg bg-content-08"></div>
      <div class="layer zone-heading"><p class="slide-heading c-text-default">In Their Words</p></div>
      <div class="layer heading-rule"></div>
      <div class="layer logo"><img src="../assets/logo/dataart-logo-small.svg" alt="DataArt"></div>

      <div class="layer zone-content is-vcenter">
        <div>
          <p class="quote-text">&ldquo;DataArt didn&rsquo;t pitch us a deck. They shipped a working proof-of-concept that solved our actual problem before we signed anything.&rdquo;</p>
          <p class="quote-attr">VP Engineering, Global Insurance Client</p>
        </div>
      </div>

      <p class="layer footer-tagline txt-p7 c-text-default">Your Partner for Progress</p>
      <p class="layer footer-section txt-p7 c-text-default">Testimonial</p>
      <p class="layer page-number txt-p7 c-text-default">10</p>
    </div>
  </div>
</body>
</html>
