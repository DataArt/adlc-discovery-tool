<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Statement / Lead</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/layouts.css">
<link rel="stylesheet" href="../shared/components.css">
</head>
<body>
  <!-- STATEMENT / LEAD — big claim on a dark bg, bottom-anchored lower-left.
       Editable: heading + lead. Heading ≤ ~80 chars (wraps to ~3 lines in the
       1337.333px block); a longer one towers up off the slide. -->
  <div class="slide-stage">
    <div class="slide">
      <div class="layer bg bg-title-06"></div>
      <p class="layer statement-heading">DataArt is your trusted partner for progress.</p>
      <p class="layer statement-lead">Through our global scale, industry-specific practices, and innovation labs, we help you design and implement data-driven, cloud-native solutions with speed, quality, and precision.</p>
      <p class="layer footer-tagline txt-p7 c-text-contrast">Your Partner for Progress</p>
      <p class="layer footer-section txt-p7 c-text-contrast">AI Lab Desk</p>
      <p class="layer page-number txt-p7 c-text-contrast">5</p>
    </div>
  </div>
</body>
</html>
