<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Content · Section placeholder (human-filled)</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/layouts.css">
<link rel="stylesheet" href="../shared/components.css">
</head>
<body>
  <!-- PLACEHOLDER slide (Part 51). Scaffolds a section the HUMAN fills from the
       DataArt Slides Library, primarily CASE STUDIES. The skill emits a
       section divider ("Case Studies") followed by THIS slide; it never
       fabricates the real content. The person drops their actual case-study
       slides in place of this one.
       PARAMETERS: heading (section name) + ph-title + ph-text. Reusable for any
       "insert your own slides here" section. bg = the section's content bg. -->
  <div class="slide-stage">
    <div class="slide">
      <div class="layer bg bg-content-01"></div>
      <div class="layer zone-heading"><p class="slide-heading c-text-default">Case Studies</p></div>
      <div class="layer heading-rule"></div>
      <div class="layer logo"><img src="../assets/logo/dataart-logo-small.svg" alt="DataArt"></div>

      <div class="layer placeholder-box">
        <p class="ph-title">Add your case studies here</p>
        <p class="ph-text">Drop in ready-made case-study slides from the DataArt Slides Library, then delete this placeholder. Pick the client stories most relevant to this audience.</p>
      </div>

      <p class="layer footer-tagline txt-p7 c-text-default">Your Partner for Progress</p>
      <p class="layer footer-section txt-p7 c-text-default">Case Studies</p>
      <p class="layer page-number txt-p7 c-text-default">99</p>
    </div>
  </div>
</body>
</html>
