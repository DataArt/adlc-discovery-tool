name: Install Trivy
description: >
  Install the Trivy CLI directly from GitHub release assets, with checksum verification.
  Avoids aquasecurity/setup-trivy's install.sh, which downloads from get.trivy.dev — a
  subdomain with no DNS record at trivy.dev's authoritative nameserver (confirmed NXDOMAIN,
  not a transient/corporate-network resolution issue) as of 2026-11.

inputs:
  version:
    description: Trivy version to install (without a leading v), e.g. 0.76.1
    required: false
    default: '0.76.1'

runs:
  using: composite
  steps:
    - shell: bash
      env:
        TRIVY_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        TARBALL="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        curl -sSL -o "$TARBALL" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${TARBALL}"
        curl -sSL -o checksums.txt "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
        grep " ${TARBALL}\$" checksums.txt | sha256sum -c -
        tar -xzf "$TARBALL" trivy
        sudo install trivy /usr/local/bin/trivy
        rm -f "$TARBALL" checksums.txt trivy
