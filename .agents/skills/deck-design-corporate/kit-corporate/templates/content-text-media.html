<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Content — Text + Media</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/layouts.css">
<link rel="stylesheet" href="../shared/components.css">
</head>
<body>
  <!-- TEXT + MEDIA — slide-heading + left text column (589) + right framed
       visual (589), gap 32 (the .cols-2 geometry). Use when a source slide
       pairs an explanation with a diagram / screenshot / product shot (deck
       migration). Left column: a short lead (.txt-h9) + 1-2 body paragraphs
       (.txt-h12) — keep them within the content budgets. Right column:
       .media-frame with the source image (object-fit:contain, shows whole).
       Drop the image into tmp/decks/<deck>/assets/ and reference it relatively.
       To flip the layout (image left, text right) swap the two .layer lefts. -->
  <div class="slide-stage">
    <div class="slide">
      <div class="layer bg bg-content-06"></div>
      <div class="layer zone-heading"><p class="slide-heading c-text-default">The Approach</p></div>
      <div class="layer heading-rule"></div>
      <div class="layer logo"><img src="../assets/logo/dataart-logo-small.svg" alt="DataArt"></div>

      <!-- left text column (115,210) 589 wide -->
      <div class="layer" style="left:153.333px; top:280px; width:785.333px;">
        <p class="txt-h9 c-text-link" style="margin:0;">The core idea</p>
        <p class="txt-h12 c-text-default" style="margin:32px 0 0;">First supporting paragraph carried over from the source slide. Keep the substance; trim only to fit.</p>
        <p class="txt-h12 c-text-default" style="margin:28px 0 0;">A second short paragraph if the source had one. Promote a key phrase with <span class="hl-bold">bold emphasis</span> where it helps.</p>
      </div>

      <!-- right framed visual (736,210) 589×488 -->
      <div class="layer" style="left:981.333px; top:280px; width:785.333px; height:650.667px;">
        <div class="media-frame media-frame--empty">
          <span class="mf-hint">Insert the source visual here</span>
          <!-- <img src="../../assets/img/slide-09-screenshot.png" alt="Product screenshot"> -->
        </div>
      </div>

      <!-- footer: 2-slot (tagline + page) -->
      <p class="layer footer-tagline txt-p7 c-text-default">Your Partner for Progress</p>
      <p class="layer page-number txt-p7 c-text-default">99</p>
    </div>
  </div>
</body>
</html>
